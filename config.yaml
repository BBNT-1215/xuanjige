# 玄机阁 配置文件
# 复制自 config.example.yaml

hermestrix_home: ~/.hermes/hermestrix
data_dir: ~/.hermes/hermestrix/data

three_libraries:
  memory: ~/.hermes/hermestrix/three_libs/memory
  skills: ~/.hermes/hermestrix/three_libs/skills
  knowledge: ~/.hermes/hermestrix/three_libs/knowledge

kanban_file: ~/.hermes/hermestrix/data/tasks.json

agents:
  default_model: "stepfun/step-3.5-flash"
  model_per_agent:
    chengzhi: "stepfun/step-3.5-flash"
    jiheng: "stepfun/step-3.5-flash"
    shenyi: "stepfun/step-3.5-flash"
    jiyan: "stepfun/step-3.5-flash"
    jizao: "stepfun/step-3.5-flash"
    xingce: "stepfun/step-3.5-flash"
    diancang: "stepfun/step-3.5-flash"
    shusuan: "stepfun/step-3.5-flash"
    bingrong: "stepfun/step-3.5-flash"
    zaohuang: "stepfun/step-3.5-flash"
    qitian: "stepfun/step-3.5-flash"
    yushi: "stepfun/step-3.5-flash"

recovery:
  max_tool_calls: 20
  max_task_duration: 300
  max_patch_failures: 3
  auto_recover: true

evolution:
  auto_archive: true
  memory_update_threshold: 3
  knowledge_expiry_days: 30

kanban_refresh_interval: 15

dashboard:
  host: "127.0.0.1"
  port: 7892
