<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玄机阁 · 工程控制台</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=swap');

  /* ==================== RESET & BASE ==================== */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ==================== TOP COMMAND BAR ==================== */
  #cmd-bar {
    background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
    border-bottom: 1px solid #ffd700;
    padding: 8px 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
    z-index: 100;
  }

  #cmd-bar .brand {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: #ffd700;
    letter-spacing: 3px;
    white-space: nowrap;
    text-shadow: 1px 1px 0 #8b6914;
  }

  #cmd-input-wrap {
    flex: 1;
    display: flex;
    gap: 6px;
    max-width: 900px;
  }

  #cmd-input {
    flex: 1;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    color: #e6edf3;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }

  #cmd-input:focus {
    border-color: #ffd700;
    box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.1);
  }

  #cmd-input::placeholder {
    color: #484f58;
  }

  .cmd-btn {
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 12px;
    color: #e6edf3;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    font-family: inherit;
  }

  .cmd-btn:hover {
    background: #30363d;
    border-color: #ffd700;
    color: #ffd700;
  }

  .cmd-btn.primary {
    background: rgba(255, 215, 0, 0.15);
    border-color: #ffd700;
    color: #ffd700;
  }

  .cmd-btn.primary:hover {
    background: rgba(255, 215, 0, 0.25);
  }

  #cmd-status {
    font-size: 11px;
    color: #7d8590;
    white-space: nowrap;
    min-width: 120px;
    text-align: right;
  }

  #cmd-status.ok { color: #27ae60; }
  #cmd-status.error { color: #f87171; }
  #cmd-status.sending { color: #fbbf24; }

  /* ==================== TAB BAR ==================== */
  #tab-bar {
    background: #161b22;
    border-bottom: 1px solid #21262d;
    padding: 0 16px;
    display: flex;
    gap: 0;
    flex-shrink: 0;
    align-items: flex-end;
  }

  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 8px 16px;
    font-size: 12px;
    color: #7d8590;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    letter-spacing: 0.5px;
  }

  .tab-btn:hover {
    color: #e6edf3;
    background: rgba(255,255,255,0.03);
  }

  .tab-btn.active {
    color: #ffd700;
    border-bottom-color: #ffd700;
  }

  .tab-btn .tab-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #30363d;
    margin-right: 6px;
  }

  .tab-btn.active .tab-dot { background: #ffd700; }

  /* ==================== MAIN CONTENT ==================== */
  #main-content {
    flex: 1;
    overflow: hidden;
    display: flex;
  }

  .tab-panel {
    display: none;
    flex: 1;
    overflow: hidden;
  }

  .tab-panel.active {
    display: flex;
  }

  /* ==================== LEFT: KANBAN (65%) ==================== */
  .kanban-section {
    flex: 0 0 65%;
    overflow-y: auto;
    padding: 12px;
  }

  .kanban-section::-webkit-scrollbar { width: 6px; }
  .kanban-section::-webkit-scrollbar-track { background: #161b22; }
  .kanban-section::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

  .kanban-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px 14px;
    border-bottom: 1px solid #21262d;
    margin-bottom: 12px;
  }

  .kanban-title {
    font-size: 14px;
    font-weight: bold;
    color: #ffd700;
    letter-spacing: 2px;
    font-family: 'ZCOOL KuaiLe', cursive;
  }

  .kanban-meta {
    font-size: 11px;
    color: #7d8590;
  }

  .kanban {
    display: flex;
    gap: 10px;
    min-width: max-content;
  }

  /* ==================== KANBAN COLUMNS ==================== */
  .column {
    flex: 0 0 220px;
    background: #161b22;
    border-radius: 8px;
    border: 1px solid #21262d;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 210px);
    overflow: hidden;
  }

  .column-header {
    padding: 10px 14px;
    font-size: 12px;
    font-weight: bold;
    border-bottom: 1px solid #21262d;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .col-badge {
    background: #21262d;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 10px;
    color: #7d8590;
  }

  .column-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .column-body::-webkit-scrollbar { width: 4px; }
  .column-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

  /* ==================== TASK CARDS ==================== */
  .task-card {
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }

  .task-card:hover {
    border-color: #ffd700;
    transform: translateY(-1px);
  }

  .task-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
  }

  .task-id {
    font-size: 9px;
    color: #484f58;
    margin-bottom: 3px;
    font-family: monospace;
  }

  .task-title {
    font-size: 12px;
    color: #e6edf3;
    line-height: 1.4;
    margin-bottom: 5px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .task-meta {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .badge {
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 9px;
    background: #21262d;
    color: #7d8590;
  }

  .badge.agent { background: rgba(255, 215, 0, 0.15); color: #ffd700; }
  .badge.org { background: rgba(88, 166, 255, 0.15); color: #58a6ff; }

  .progress-bar {
    height: 2px;
    background: #21262d;
    border-radius: 1px;
    margin-top: 6px;
    overflow: hidden;
  }

  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, #ffd700, #c9a84c);
    transition: width 0.3s;
  }

  .state-承旨::before, .state-Taizi::before { background: #9b59b6; }
  .state-机衡::before, .state-Zhongshu::before { background: #3498db; }
  .state-审议::before, .state-Menxia::before { background: #e67e22; }
  .state-执行::before, .state-Doing::before { background: #e74c3c; }
  .state-待回奏::before, .state-Review::before { background: #1abc9c; }
  .state-完成::before, .state-Done::before { background: #27ae60; }
  .state-阻塞::before, .state-Blocked::before { background: #c0392b; }
  .state-待处理::before, .state-Pending::before { background: #484f58; }
  .state-pending::before { background: #484f58; }
  .state-running::before { background: #3498db; }
  .state-done::before { background: #27ae60; }

  /* ==================== RIGHT: CONTROL PANEL (35%) ==================== */
  .control-panel {
    flex: 1;
    border-left: 2px solid #ffd700;
    overflow-y: auto;
    background: #0d1117;
    display: flex;
    flex-direction: column;
  }

  .control-panel::-webkit-scrollbar { width: 6px; }
  .control-panel::-webkit-scrollbar-track { background: #0d1117; }
  .control-panel::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

  /* ==================== SYSTEM STATUS HEADER ==================== */
  .sys-header {
    background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
    border-bottom: 1px solid #21262d;
    padding: 12px 16px;
    flex-shrink: 0;
  }

  .sys-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .sys-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: #ffd700;
    letter-spacing: 3px;
    text-shadow: 1px 1px 0 #8b6914;
  }

  .conn-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #7d8590;
  }

  .conn-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #27ae60;
    animation: conn-pulse 2s ease-in-out infinite;
  }

  .conn-dot.offline {
    background: #f87171;
    animation: none;
  }

  @keyframes conn-pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.4); }
    50% { opacity: 0.8; box-shadow: 0 0 0 4px rgba(39, 174, 96, 0); }
  }

  .sys-stats-row {
    display: flex;
    gap: 6px;
  }

  .sys-stat-chip {
    flex: 1;
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 4px;
    padding: 5px 8px;
    text-align: center;
  }

  .sys-stat-chip .val {
    font-size: 16px;
    font-weight: bold;
    color: #ffd700;
    line-height: 1.2;
  }

  .sys-stat-chip .lbl {
    font-size: 9px;
    color: #7d8590;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .sys-stat-chip.exec .val { color: #e74c3c; }
  .sys-stat-chip.pending .val { color: #fbbf24; }
  .sys-stat-chip.done .val { color: #27ae60; }

  /* ==================== AGENT PIXEL GRID ==================== */
  .agent-section {
    background: #161b22;
    border-bottom: 1px solid #21262d;
    padding: 12px;
    flex-shrink: 0;
  }

  .agent-section-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 12px;
    color: #ffd700;
    letter-spacing: 2px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .agent-section-title::before {
    content: '◆';
    color: #c9a84c;
    font-size: 9px;
  }

  .agent-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }

  .agent-room {
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 6px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    position: relative;
    transition: border-color 0.2s;
    cursor: pointer;
  }

  .agent-room:hover { border-color: #ffd700; }

  .agent-room .room-role {
    font-size: 10px;
    color: #ffd700;
    font-weight: bold;
  }

  .agent-room .room-label {
    font-size: 9px;
    color: #7d8590;
    text-align: center;
  }

  /* ==================== PIXEL CHARACTER ==================== */
  .pixel-char {
    position: relative;
    width: 48px;
    height: 56px;
    image-rendering: pixelated;
    flex-shrink: 0;
  }

  .pixel-char::before {
    content: '';
    position: absolute;
    width: 4px;
    height: 4px;
    background: transparent;
    box-shadow:
      12px 0 0 #f5d5a0, 16px 0 0 #f5d5a0, 20px 0 0 #f5d5a0, 24px 0 0 #f5d5a0,
      8px 4px 0 #f5d5a0, 12px 4px 0 #f5d5a0, 16px 4px 0 #f5d5a0, 20px 4px 0 #f5d5a0,
      24px 4px 0 #f5d5a0, 28px 4px 0 #f5d5a0,
      4px 8px 0 #8b6914, 8px 8px 0 #8b6914, 12px 8px 0 #8b6914,
      16px 8px 0 #ffd700, 20px 8px 0 #ffd700,
      24px 8px 0 #8b6914, 28px 8px 0 #8b6914, 32px 8px 0 #8b6914,
      4px 12px 0 #f5d5a0, 8px 12px 0 #f5d5a0, 12px 12px 0 #2d1a0e,
      16px 12px 0 #f5d5a0, 20px 12px 0 #f5d5a0, 24px 12px 0 #2d1a0e,
      28px 12px 0 #f5d5a0, 32px 12px 0 #f5d5a0,
      4px 16px 0 #f5d5a0, 8px 16px 0 #f5d5a0, 12px 16px 0 #f5d5a0,
      16px 16px 0 #f5d5a0, 20px 16px 0 #f5d5a0, 24px 16px 0 #f5d5a0,
      28px 16px 0 #f5d5a0, 32px 16px 0 #f5d5a0,
      16px 20px 0 #c9a84c, 20px 20px 0 #c9a84c,
      8px 24px 0 var(--robe-color, #c0392b), 12px 24px 0 var(--robe-color, #c0392b),
      16px 24px 0 var(--robe-color, #c0392b), 20px 24px 0 var(--robe-color, #c0392b),
      24px 24px 0 var(--robe-color, #c0392b), 28px 24px 0 var(--robe-color, #c0392b),
      8px 28px 0 var(--robe-color, #c0392b), 12px 28px 0 var(--robe-color, #c0392b),
      16px 28px 0 var(--robe-color, #c0392b), 20px 28px 0 var(--robe-color, #c0392b),
      24px 28px 0 var(--robe-color, #c0392b), 28px 28px 0 var(--robe-color, #c0392b),
      4px 32px 0 var(--robe-color, #c0392b), 8px 32px 0 var(--robe-color, #c0392b),
      12px 32px 0 var(--robe-color, #c0392b), 16px 32px 0 var(--robe-color, #c0392b),
      20px 32px 0 var(--robe-color, #c0392b), 24px 32px 0 var(--robe-color, #c0392b),
      28px 32px 0 var(--robe-color, #c0392b), 32px 32px 0 var(--robe-color, #c0392b),
      0 36px 0 var(--robe-color, #c0392b), 4px 36px 0 var(--robe-color, #c0392b),
      8px 36px 0 var(--robe-color, #c0392b), 12px 36px 0 var(--robe-color, #c0392b),
      16px 36px 0 var(--robe-color, #c0392b), 20px 36px 0 var(--robe-color, #c0392b),
      24px 36px 0 var(--robe-color, #c0392b), 28px 36px 0 var(--robe-color, #c0392b),
      32px 36px 0 var(--robe-color, #c0392b), 36px 36px 0 var(--robe-color, #c0392b);
    animation: char-idle 1.2s steps(1) infinite;
  }

  .pixel-char.idle::before { animation: char-idle 1.4s ease-in-out infinite; }
  .pixel-char.thinking::before { animation: char-think 0.8s ease-in-out infinite; }
  .pixel-char.busy::before { animation: char-busy 0.4s steps(1) infinite; }
  .pixel-char.mad::before { animation: char-mad 0.15s steps(2) infinite; }

  .pixel-char[data-role="zhishi"] { --robe-color: #e74c3c; }
  .pixel-char[data-role="qitian"] { --robe-color: #1abc9c; }
  .pixel-char[data-role="chengzhi"] { --robe-color: #7b68ee; }
  .pixel-char[data-role="yushi"] { --robe-color: #34495e; }
  .pixel-char[data-role="jiheng"] { --robe-color: #ffd700; }
  .pixel-char[data-role="shenyi"] { --robe-color: #c0392b; }
  .pixel-char[data-role="jizao"] { --robe-color: #2980b9; }
  .pixel-char[data-role="xingce"] { --robe-color: #8b4513; }
  .pixel-char[data-role="diancang"] { --robe-color: #27ae60; }
  .pixel-char[data-role="shusuan"] { --robe-color: #e67e22; }
  .pixel-char[data-role="bingrong"] { --robe-color: #c0392b; }
  .pixel-char[data-role="jiyan"] { --robe-color: #9b59b6; }

  @keyframes char-idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes char-think { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } 60% { transform: translateY(-2px); } }
  @keyframes char-busy { 0%, 100% { transform: translateY(0) scale(1); } 25% { transform: translateY(-3px) scale(1.05); } 75% { transform: translateY(3px) scale(0.95); } }
  @keyframes char-mad { 0% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

  /* ==================== STATUS BUBBLE ==================== */
  .status-bubble {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #0d1117;
    font-size: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    animation: bubble-pulse 2s ease-in-out infinite;
  }

  .status-bubble.idle { background: #4ade80; }
  .status-bubble.thinking { background: #60a5fa; }
  .status-bubble.busy { background: #fbbf24; }
  .status-bubble.mad { background: #f87171; animation: bubble-shake 0.2s steps(2) infinite; }

  @keyframes bubble-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  @keyframes bubble-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px) rotate(-5deg); } 75% { transform: translateX(2px) rotate(5deg); } }

  .thought-bubble {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    border: 2px solid #ffd700;
    border-radius: 8px;
    padding: 2px 6px;
    font-size: 9px;
    color: #0d1117;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 20;
  }

  .pixel-char.thinking .thought-bubble { opacity: 1; animation: float-up 1s ease-in-out infinite; }
  @keyframes float-up { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-4px); } }

  /* ==================== ACTIVITY FEED ==================== */
  .activity-section {
    flex: 1;
    padding: 12px;
    min-height: 160px;
  }

  .activity-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 12px;
    color: #ffd700;
    letter-spacing: 2px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .activity-title::before { content: '◆'; color: #c9a84c; font-size: 9px; }

  .activity-feed {
    max-height: 220px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .activity-feed::-webkit-scrollbar { width: 4px; }
  .activity-feed::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

  .activity-item {
    font-size: 11px;
    padding: 6px 10px;
    background: #161b22;
    border-left: 3px solid #ffd700;
    border-radius: 0 4px 4px 0;
    animation: slide-in 0.3s ease-out;
  }

  .activity-item .time { color: #7d8590; font-size: 10px; font-family: monospace; }
  .activity-item .desc { color: #e6edf3; margin-top: 2px; line-height: 1.3; }
  .activity-item .agent-tag { color: #ffd700; font-weight: bold; font-size: 10px; }

  @keyframes slide-in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

  /* ==================== STATS CARDS ==================== */
  .stats-section {
    background: #161b22;
    border-top: 1px solid #21262d;
    padding: 12px;
    flex-shrink: 0;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 6px;
  }

  .stat-card {
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 6px;
    padding: 8px;
    text-align: center;
  }

  .stat-card .stat-num { font-size: 20px; font-weight: bold; color: #ffd700; line-height: 1.2; }
  .stat-card .stat-label { font-size: 9px; color: #7d8590; text-transform: uppercase; margin-top: 3px; }
  .stat-card.exec .stat-num { color: #e74c3c; }
  .stat-card.pending .stat-num { color: #fbbf24; }
  .stat-card.review .stat-num { color: #58a6ff; }
  .stat-card.done .stat-num { color: #27ae60; }

  /* ==================== LEGEND ==================== */
  .legend {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #7d8590; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
  .legend-dot.idle { background: #4ade80; }
  .legend-dot.thinking { background: #60a5fa; }
  .legend-dot.busy { background: #fbbf24; }
  .legend-dot.mad { background: #f87171; }

  /* ==================== SETTINGS PANEL ==================== */
  #settings-panel {
    display: none;
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 520px;
    background: #161b22;
    border-left: 2px solid #ffd700;
    z-index: 300;
    flex-direction: column;
    overflow: hidden;
  }

<script>
// ================================================================
// CONSTANTS
// ================================================================

const COLUMNS = [
  { key: 'ready',    label: '⏳ 待处理', color: '#9b59b6', desc: '就绪' },
  { key: 'running',  label: '⚙️ 执行中', color: '#3498db', desc: '处理中' },
  { key: 'todo',     label: '📋 待办',   color: '#e67e22', desc: '待办' },
  { key: 'blocked',  label: '🚫 阻塞',   color: '#c0392b', desc: '异常' },
  { key: 'done',    label: '🏁 完成',   color: '#27ae60', desc: '已完成' },
  { key: 'archived', label: '📦 归档',   color: '#7d8590', desc: '归档' },
];

const STATE_MAP = {
  // 直接映射：数据库status → 看板column key（现在一致）
  'ready': 'ready', 'todo': 'todo', 'running': 'running',
  'done': 'done', 'blocked': 'blocked', 'archived': 'archived',
};

const AGENTS = [
  { id: 'zhishi',   role: 'zhishi',   name: '玄档',   dept: '情报层' },
  { id: 'qitian',   role: 'qitian',   name: '枢观',   dept: '战略层' },
  { id: 'chengzhi', role: 'chengzhi', name: '承旨',   dept: '协调层' },
  { id: 'yushi',    role: 'yushi',    name: '枢鉴',   dept: '协调层' },
  { id: 'jiheng',   role: 'jiheng',   name: '机衡',   dept: '协调层' },
  { id: 'shenyi',   role: 'shenyi',   name: '审议',   dept: '协调层' },
  { id: 'jizao',    role: 'jizao',    name: '技造',   dept: '执行层' },
  { id: 'xingce',   role: 'xingce',   name: '刑策',   dept: '执行层' },
  { id: 'diancang', role: 'diancang', name: '文册',   dept: '执行层' },
  { id: 'shusuan',  role: 'shusuan',  name: '数算',   dept: '执行层' },
  { id: 'bingrong', role: 'bingrong', name: '兵戎',   dept: '执行层' },
  { id: 'jiyan',    role: 'jiyan',    name: '机研',   dept: '执行层' },
];

// ================================================================
// STATE
// ================================================================
let tasks = [];
let hermesStatus = {};
let cronJobs = [];
let activities = [];

// ================================================================
// HELPERS
// ================================================================
function resolveState(state) {
  return STATE_MAP[state] || state || 'pending';
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function colByKey(key) {
  return COLUMNS.find(c => c.key === key) || { color: '#484f58', desc: key };
}

// ================================================================
// CMD BAR
// ================================================================
const cmdInput = document.getElementById('cmd-input');
const cmdStatus = document.getElementById('cmd-status');

cmdInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = cmdInput.value.trim();
    if (!val) return;
    handleCommand(val);
  }
});

async function handleCommand(val) {
  // 判断是创建任务还是发送命令
  if (val.startsWith('/') || val.startsWith('!')) {
    // 直接命令
    await sendDirectCmd(val.slice(1));
  } else if (val.startsWith('创建 ') || val.startsWith('task ') || val.startsWith('任务 ')) {
    const title = val.replace(/^(创建 |task |任务 )/, '');
    await createTask(title);
  } else {
    // 默认：创建任务
    await createTask(val);
  }
}

async function submitTask() {
  const val = cmdInput.value.trim();
  if (!val) return;
  cmdInput.value = '';
  await handleCommand(val);
}

async function createTask(title) {
  setCmdStatus('sending', '创建任务中...');
  try {
    const res = await fetch('/api/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description: '' }),
    });
    const data = await res.json();
    if (data.ok) {
      setCmdStatus('ok', `✓ 任务已创建: ${data.task_id}`);
      showToast(`✓ 任务「${title}」已创建，ID: ${data.task_id}`);
      setTimeout(() => loadAll(), 500);
    } else {
      setCmdStatus('error', `✗ ${data.error}`);
      showToast(`✗ 创建失败: ${data.error}`, true);
    }
  } catch (e) {
    setCmdStatus('error', '✗ 网络错误');
    showToast('✗ 网络错误: ' + e.message, true);
  }
  setTimeout(() => setCmdStatus('ok', '就绪'), 3000);
}

async function sendDirectCmd(cmd) {
  setCmdStatus('sending', '发送命令...');
  try {
    const res = await fetch('/api/cmd', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd, channel: 'local' }),
    });
    const data = await res.json();
    if (data.ok) {
      setCmdStatus('ok', '✓ 命令已执行');
      showToast(`命令输出:\n${data.output || '(无输出)'}`);
    } else {
      setCmdStatus('error', `✗ ${data.output || '执行失败'}`);
      showToast(`✗ ${data.output || '执行失败'}`, true);
    }
  } catch (e) {
    setCmdStatus('error', '✗ 网络错误');
    showToast('✗ 网络错误', true);
  }
  setTimeout(() => setCmdStatus('ok', '就绪'), 4000);
}

function setCmdStatus(type, msg) {
  cmdStatus.className = type;
  cmdStatus.textContent = msg;
}

function showToast(msg, isError = false) {
  const toast = document.getElementById('cmd-toast');
  toast.className = isError ? 'error' : '';
  toast.innerHTML = msg.replace(/\n/g, '<br>') + (isError ? '' : '<pre>' + msg + '</pre>');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), isError ? 5000 : 3000);
}

function clearTasks() {
  tasks = [];
  activities = [];
  renderKanban();
  renderAgentGrid();
  renderStats();
  renderActivity();
}

// ================================================================
// API LOADER
// ================================================================
async function loadAll() {
  try {
    const [tasksRes, healthRes, cronRes] = await Promise.all([
      fetch('/api/tasks').catch(() => ({ ok: false, json: () => [] })),
      fetch('/api/hermes/status').catch(() => ({ ok: false, json: () => ({}) })),
      fetch('/api/cron/jobs').catch(() => ({ ok: false, json: () => ({ jobs: [] }) })),
    ]);

    if (tasksRes.ok) {
      tasks = await tasksRes.json();
      // 解析body字段为对象
      for (const t of tasks) {
        if (t.body && typeof t.body === 'string') {
          try { t.body_obj = JSON.parse(t.body); } catch { t.body_obj = {}; }
        } else {
          t.body_obj = t.body || {};
        }
      }
    }
    if (healthRes.ok) hermesStatus = await healthRes.json();
    if (cronRes.ok) {
      const cronData = await cronRes.json();
      cronJobs = cronData.jobs || [];
    }

    renderKanban();
    renderAgentGrid();
    renderStats();
    renderActivity();
    updateConnection(true);
    document.getElementById('last-update').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  } catch (e) {
    console.error('Load error:', e);
    updateConnection(false);
  }
}

function updateConnection(ok) {
  const dot = document.getElementById('conn-dot');
  const txt = document.getElementById('conn-text');
  if (ok) {
    dot.classList.remove('offline');
    txt.textContent = '连接正常';
  } else {
    dot.classList.add('offline');
    txt.textContent = '离线';
  }
}

// ================================================================
// KANBAN RENDER
// ================================================================
function renderKanban() {
  const kanban = document.getElementById('kanban');
  let html = '';

  for (const col of COLUMNS) {
    const colTasks = tasks.filter(t => {
      const s = resolveState(t.state || t.status);
      return s === col.key;
    });

    html += `<div class="column">
      <div class="column-header" style="border-top: 3px solid ${col.color}">
        ${col.label}
        <span class="col-badge">${colTasks.length}</span>
      </div>
      <div class="column-body">`;

    if (colTasks.length === 0) {
      html += '<div class="empty-state">—</div>';
    } else {
      for (const t of colTasks.slice(0, 30)) {
        const agent = t.official || t.agent || t.assignee || '';
        const state = resolveState(t.state || t.status);

        html += `<div class="task-card state-${state}" onclick="showDetail('${t.id}')">
          <div class="task-id">${escapeHtml(t.id || '')}</div>
          <div class="task-title">${escapeHtml(t.title || t.name || '')}</div>
          <div class="task-meta">
            ${agent ? `<span class="badge agent">${escapeHtml(agent)}</span>` : ''}
          </div>
        </div>`;
      }
      if (colTasks.length > 30) {
        html += `<div class="empty-state">还有 ${colTasks.length - 30} 项...</div>`;
      }
    }

    html += '</div></div>';
  }

  kanban.innerHTML = html;
}

// ================================================================
// AGENT GRID
// ================================================================
function computeAgentState(agentId) {
  const agentTasks = tasks.filter(t => {
    const a = (t.official || t.agent || t.assignee || '').toLowerCase();
    return a.includes(agentId.toLowerCase());
  });

  const busyCount = agentTasks.filter(t => {
    const s = resolveState(t.state || t.status);
    return s === 'running';
  }).length;

  const blockedCount = agentTasks.filter(t => {
    const s = resolveState(t.state || t.status);
    return s === 'blocked';
  }).length;

  if (blockedCount > 0) return 'mad';
  if (busyCount >= 3) return 'busy';
  if (busyCount >= 1) return 'thinking';
  return 'idle';
}

function renderAgentGrid() {
  const grid = document.getElementById('agent-grid');
  let html = '';

  for (const agent of AGENTS) {
    const state = computeAgentState(agent.id);
    const taskCount = tasks.filter(t => {
      const a = (t.official || t.agent || t.assignee || '').toLowerCase();
      return a.includes(agent.id.toLowerCase());
    }).length;

    const thoughtMap = { idle: '', thinking: '思考中...', busy: '执行中', mad: '阻塞!' };

    html += `<div class="agent-room">
      <div class="pixel-char ${state}" data-role="${agent.role}" id="char-${agent.id}" style="position:relative">
        <div class="status-bubble ${state}"></div>
        ${state === 'thinking' ? `<div class="thought-bubble">${thoughtMap[state]}</div>` : ''}
      </div>
      <div class="room-role">${agent.name}</div>
      <div class="room-label">${taskCount}任务</div>
    </div>`;
  }

  grid.innerHTML = html;
}

// ================================================================
// STATS
// ================================================================
function renderStats() {
  const total = tasks.length;
  const exec = tasks.filter(t => resolveState(t.state || t.status) === 'running').length;
  const pending = tasks.filter(t => resolveState(t.state || t.status) === 'pending').length;
  const done = tasks.filter(t => resolveState(t.state || t.status) === 'done').length;
  const blocked = tasks.filter(t => resolveState(t.state || t.status) === 'blocked').length;

  document.getElementById('hstat-total').textContent = total;
  document.getElementById('hstat-exec').textContent = exec;
  document.getElementById('hstat-pending').textContent = pending;
  document.getElementById('hstat-done').textContent = done;

  document.getElementById('stat-exec').textContent = exec;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-review').textContent = pending;
  document.getElementById('stat-done').textContent = done;
}

// ================================================================
// ACTIVITY FEED
// ================================================================
function renderActivity() {
  const feed = document.getElementById('activity-feed');
  if (activities.length === 0) {
    activities = tasks.slice(0, 15).map(t => ({
      time: (t.updated_at || t.created_at || '').slice(11, 19) || '',
      desc: `${t.title || t.id} → ${resolveState(t.state || t.status)}`,
      agent: t.official || t.agent || '',
      state: resolveState(t.state || t.status),
    }));
  }

  if (activities.length === 0) {
    feed.innerHTML = '<div class="empty-state">暂无活动记录</div>';
    return;
  }

  let html = '';
  for (const act of activities.slice(0, 12)) {
    const col = colByKey(act.state);
    html += `<div class="activity-item" style="border-left-color:${col.color}">
      <div class="time">${act.time}</div>
      <div class="desc">${escapeHtml(act.desc || '')}</div>
      ${act.agent ? `<div><span class="agent-tag">@${escapeHtml(act.agent)}</span></div>` : ''}
    </div>`;
  }
  feed.innerHTML = html;
}

// ================================================================
// DETAIL PANEL
// ================================================================
async function showDetail(taskId) {
  const task = tasks.find(t => String(t.id) === String(taskId));
  if (!task) return;

  const panel = document.getElementById('detail-panel');
  const content = document.getElementById('detail-content');
  document.getElementById('detail-title').textContent = taskId;

  const state = resolveState(task.state || task.status);

  let html = `
    <div class="detail-section">
      <div class="detail-section-title">标题</div>
      <div style="font-size:13px;line-height:1.5">${escapeHtml(task.title || task.name || '—')}</div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">状态</div>
      <div>
        <span class="detail-tag" style="border-left:3px solid ${colByKey(state).color}">${state}</span>
        ${(task.official || task.agent || task.assignee) ? `<span class="detail-tag">${escapeHtml(task.official || task.agent || task.assignee)}</span>` : ''}
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">描述</div>
      <div style="font-size:12px;color:#7d8590;line-height:1.5">${escapeHtml(task.description || task.desc || task.body_obj?.description || '—')}</div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">成果</div>
      <div style="font-size:12px;color:#c9d1d9;line-height:1.6;max-height:400px;overflow-y:auto;background:#161b22;padding:10px;border-radius:6px;white-space:pre-wrap;word-break:break-all">${task.result ? escapeHtml(task.result) : '<span style="color:#7d8590">— 无成果</span>'}</div>
    </div>
    ${task.result ? `<div class="detail-section"><button class="detail-action-btn" onclick="downloadResult('${taskId}', '${escapeHtml(task.title || taskId)}')" style="margin-top:8px">⬇ 下载成果</button></div>` : ''}
    <div class="detail-section">
      <div class="detail-section-title">时间</div>
      <div style="font-size:11px;color:#7d8590">创建: ${task.created_at ? new Date(task.created_at*1000).toLocaleString('zh-CN') : '—'}<br>完成: ${task.completed_at ? new Date(task.completed_at*1000).toLocaleString('zh-CN') : '—'}</div>
    </div>`;

  // Action buttons
  html += `<div class="detail-actions">
    <button class="detail-action-btn" onclick="flowTask('${taskId}', 'next')">▶ 流转</button>
    <button class="detail-action-btn" onclick="flowTask('${taskId}', 'retry')">↻ 重试</button>
    <button class="detail-action-btn danger" onclick="flowTask('${taskId}', 'cancel')">✕ 取消</button>
  </div>`;

  content.innerHTML = html;
  panel.classList.add('active');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('active');
}

function downloadResult(taskId, title) {
  const task = tasks.find(t => String(t.id) === String(taskId));
  if (!task || !task.result) return;
  const blob = new Blob([task.result], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_')}_${taskId}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

async function flowTask(taskId, action) {
  try {
    const res = await fetch('/api/tasks/flow', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task_id: taskId, action }),
    });
    const data = await res.json();
    if (data.ok) {
      showToast(`✓ 任务 ${taskId} 已${action === 'next' ? '流转' : action === 'retry' ? '重试' : '取消'}`);
      closeDetail();
      setTimeout(() => loadAll(), 500);
    } else {
      showToast(`✗ ${data.error}`, true);
    }
  } catch (e) {
    showToast('✗ 操作失败', true);
  }
}

// Close detail when clicking outside
document.addEventListener('click', (e) => {
  const panel = document.getElementById('detail-panel');
  if (panel.classList.contains('active') && !panel.contains(e.target) && !e.target.closest('.task-card')) {
    closeDetail();
  }
});

// ================================================================
// SETTINGS PANEL
// ================================================================
function openSettings() {
  const panel = document.getElementById('settings-panel');
  panel.classList.add('active');
  loadSettings();
}

function closeSettings() {
  document.getElementById('settings-panel').classList.remove('active');
}

async function loadSettings() {
  try {
    const [statusRes, agentsRes, cronRes, healthRes] = await Promise.all([
      fetch('/api/hermes/status'),
      fetch('/api/agents'),
      fetch('/api/cron/jobs'),
      fetch('/api/health'),
    ]);

    const status = statusRes.ok ? await statusRes.json() : {};
    const agentsData = agentsRes.ok ? await agentsRes.json() : { agents: [] };
    const cronData = cronRes.ok ? await cronRes.json() : { jobs: [] };
    const health = healthRes.ok ? await healthRes.json() : {};

    // Hermes Status
    const hsGrid = document.getElementById('settings-hermes-status') || document.getElementById('hermes-status-grid');
    if (hsGrid) {
      hsGrid.innerHTML = `
        <div class="hs-card">
          <div class="hs-label">Hermes Agent</div>
          <div class="hs-val ${status.hermes_running ? 'running' : 'stopped'}">${status.hermes_running ? '● 运行中' : '○ 停止'}</div>
          <div style="font-size:10px;color:#7d8590;margin-top:4px">PID: ${status.hermes_pids ? status.hermes_pids.join(', ') : '—'}</div>
        </div>
        <div class="hs-card">
          <div class="hs-label">Watchdog</div>
          <div class="hs-val ${status.watchdog_running ? 'running' : 'stopped'}">${status.watchdog_running ? '● 运行中' : '○ 停止'}</div>
        </div>
        <div class="hs-card">
          <div class="hs-label">看板数据库</div>
          <div class="hs-val ${status.db_exists ? 'running' : 'warning'}">${status.db_exists ? '● 已连接' : '○ 未连接'}</div>
          <div style="font-size:10px;color:#7d8590;margin-top:4px;word-break:break-all">${(status.kanban_db || '').split('/').slice(-2).join('/')}</div>
        </div>
        <div class="hs-card">
          <div class="hs-label">运行时长</div>
          <div class="hs-val">${health.uptime_human || '—'}</div>
        </div>`;
    }

    // Agent list
    const agentList = document.getElementById('settings-agent-list') || document.getElementById('agent-list-settings');
    if (agentList) {
      if (agentsData.agents && agentsData.agents.length > 0) {
        agentList.innerHTML = agentsData.agents.map(a => `
          <div class="agent-list-item">
            <div class="ali-dot ${a.has_soul ? 'active' : 'inactive'}"></div>
            <div class="ali-name">${escapeHtml(a.name || a.id)}</div>
            <div class="ali-dept">${escapeHtml(a.dept || '')}</div>
            <div class="ali-desc">${escapeHtml(a.description || '')}</div>
          </div>`).join('');
      } else {
        // Fallback to local AGENTS list
        agentList.innerHTML = AGENTS.map(a => `
          <div class="agent-list-item">
            <div class="ali-dot active"></div>
            <div class="ali-name">${a.name}</div>
            <div class="ali-dept">${a.dept}</div>
            <div class="ali-desc">${a.dept} · ${a.id}</div>
          </div>`).join('');
      }
    }

    // Cron jobs
    const cronList = document.getElementById('settings-cron-list') || document.getElementById('cron-list');
    if (cronList) {
      if (cronData.jobs && cronData.jobs.length > 0) {
        cronList.innerHTML = cronData.jobs.map(j => `
          <div class="cron-job-item">
            <div class="cji-name">${escapeHtml(j.name || j.id)}</div>
            <div class="cji-schedule">${escapeHtml(j.schedule || '—')}</div>
            <button class="cji-toggle ${j.enabled ? 'active' : ''}" onclick="toggleCron('${j.id}', ${!j.enabled})">${j.enabled ? '暂停' : '恢复'}</button>
          </div>`).join('');
      } else {
        cronList.innerHTML = '<div class="empty-state">暂无 Cron 任务</div>';
      }
    }

    // System paths
    const pathsEl = document.getElementById('settings-sys-paths');
    if (pathsEl) {
      pathsEl.innerHTML = `
        <div class="sys-info-row"><span class="si-key">看板数据库</span><span class="si-val">${status.kanban_db || '~/.hermes/kanban.db'}</span></div>
        <div class="sys-info-row"><span class="si-key">Hermestrix</span><span class="si-val">${health.kanban_db ? health.kanban_db.replace(/\//g, ' / ').split('/').slice(-3).join('/') : '—'}</span></div>`;
    }

    // System panel
    if (document.getElementById('panel-system').classList.contains('active')) {
      renderSystemPanel(status, health);
    }

    // Agent panel
    if (document.getElementById('panel-agents').classList.contains('active')) {
      const alEl = document.getElementById('agent-list-settings');
      if (alEl) {
        alEl.innerHTML = agentList ? agentList.innerHTML : alEl.innerHTML;
      }
    }

    // Cron panel
    if (document.getElementById('panel-cron').classList.contains('active')) {
      const clEl = document.getElementById('cron-list');
      if (clEl) {
        clEl.innerHTML = cronList ? cronList.innerHTML : clEl.innerHTML;
      }
    }

  } catch (e) {
    console.error('Settings load error:', e);
  }
}

function renderSystemPanel(status, health) {
  const hsGrid = document.getElementById('hermes-status-grid');
  if (hsGrid) {
    hsGrid.innerHTML = `
      <div class="hs-card"><div class="hs-label">Hermes</div><div class="hs-val ${status.hermes_running ? 'running' : 'stopped'}">${status.hermes_running ? '● 运行' : '○ 停止'}</div></div>
      <div class="hs-card"><div class="hs-label">Watchdog</div><div class="hs-val ${status.watchdog_running ? 'running' : 'stopped'}">${status.watchdog_running ? '● 运行' : '○ 停止'}</div></div>
      <div class="hs-card"><div class="hs-label">Dashboard</div><div class="hs-val running">● :${status.dashboard_port || 7892}</div></div>
      <div class="hs-card"><div class="hs-label">运行时长</div><div class="hs-val">${health.uptime_human || '—'}</div></div>`;
  }

  const sysInfo = document.getElementById('sys-info-list');
  if (sysInfo) {
    sysInfo.innerHTML = `
      <div class="sys-info-row"><span class="si-key">数据库</span><span class="si-val">${status.db_exists ? '● 已连接' : '○ 未连接'}</span></div>
      <div class="sys-info-row"><span class="si-key">看板路径</span><span class="si-val">${(status.kanban_db || '').split('/').slice(-2).join('/')}</span></div>
      <div class="sys-info-row"><span class="si-key">Cron任务</span><span class="si-val">${cronJobs.length}个</span></div>
      <div class="sys-info-row"><span class="si-key">总任务</span><span class="si-val">${tasks.length}个</span></div>`;
  }

  const statsDetail = document.getElementById('sys-stats-detail');
  if (statsDetail) {
    const done = tasks.filter(t => resolveState(t.state || t.status) === 'done').length;
    const running = tasks.filter(t => resolveState(t.state || t.status) === 'running').length;
    const pending = tasks.filter(t => resolveState(t.state || t.status) === 'pending').length;
    const blocked = tasks.filter(t => resolveState(t.state || t.status) === 'blocked').length;
    statsDetail.innerHTML = `
      <div class="sys-info-row"><span class="si-key">总计</span><span class="si-val">${tasks.length}</span></div>
      <div class="sys-info-row"><span class="si-key">运行中</span><span class="si-val" style="color:#3498db">${running}</span></div>
      <div class="sys-info-row"><span class="si-key">已完成</span><span class="si-val" style="color:#27ae60">${done}</span></div>
      <div class="sys-info-row"><span class="si-key">待处理</span><span class="si-val" style="color:#fbbf24">${pending}</span></div>
      <div class="sys-info-row"><span class="si-key">阻塞</span><span class="si-val" style="color:#f87171">${blocked}</span></div>`;
  }
}

async function toggleCron(jobId, enable) {
  const url = enable ? '/api/cron/resume' : '/api/cron/pause';
  try {
    await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ job_id: jobId }),
    });
    loadSettings();
  } catch (e) {
    showToast('✗ 操作失败', true);
  }
}

// ================================================================
// TAB SWITCHING
// ================================================================
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

  const btn = [...document.querySelectorAll('.tab-btn')].find(b => b.textContent.includes(
    tab === 'kanban' ? '看板' : tab === 'agents' ? 'Agent' : tab === 'cron' ? 'Cron' : '系统'
  ));
  if (btn) btn.classList.add('active');

  const panel = document.getElementById('panel-' + tab);
  if (panel) panel.classList.add('active');

  if (tab !== 'kanban') {
    loadSettings();
  }
}
