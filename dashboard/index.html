<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玄机阁 - 自我进化AI协作系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1419; color: #e7e9ea; min-height: 100vh; }

  /* Header */
  .header { background: #1a1f2e; border-bottom: 1px solid #2f3847; padding: 12px 24px; display: flex; align-items: center; gap: 24px; }
  .header-brand { display: flex; flex-direction: column; }
  .header h1 { font-size: 18px; color: #f7dc6f; letter-spacing: 2px; }
  .header .subtitle { font-size: 11px; color: #7f8c8d; margin-top: 2px; }
  .header-right { margin-left: auto; font-size: 11px; color: #7f8c8d; }

  /* Stats bar */
  .stats { display: flex; gap: 0; padding: 0 24px; background: #1a1f2e; border-bottom: 1px solid #2f3847; }
  .stat { padding: 12px 24px; text-align: center; border-right: 1px solid #2f3847; }
  .stat:first-child { border-left: 3px solid #f7dc6f; }
  .stat .num { font-size: 22px; font-weight: bold; color: #f7dc6f; }
  .stat .label { font-size: 10px; color: #7f8c8d; text-transform: uppercase; margin-top: 2px; }
  .stat .sub { font-size: 9px; color: #4a5568; }

  /* Kanban */
  .kanban-wrap { padding: 12px; overflow-x: auto; }
  .kanban { display: flex; gap: 10px; min-width: max-content; }
  .column { flex: 0 0 240px; background: #1a1f2e; border-radius: 8px; border: 1px solid #2f3847; display: flex; flex-direction: column; max-height: calc(100vh - 160px); }
  .column-header { padding: 10px 14px; font-size: 12px; font-weight: bold; border-bottom: 1px solid #2f3847; display: flex; justify-content: space-between; align-items: center; }
  .column-body { flex: 1; overflow-y: auto; padding: 8px; }

  /* Task cards */
  .task-card { background: #252d3d; border: 1px solid #2f3847; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; transition: border-color 0.15s; }
  .task-card:hover { border-color: #f7dc6f; }
  .task-card .task-id { font-size: 9px; color: #4a5568; margin-bottom: 3px; }
  .task-card .task-title { font-size: 12px; color: #e7e9ea; line-height: 1.4; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .task-card .task-meta { display: flex; gap: 4px; flex-wrap: wrap; }
  .badge { padding: 1px 5px; border-radius: 3px; font-size: 9px; background: #2f3847; color: #a0a0a0; }
  .progress-bar { height: 2px; background: #2f3847; border-radius: 1px; margin-top: 6px; overflow: hidden; }
  .progress-bar .fill { height: 100%; background: #f7dc6f; transition: width 0.3s; }

  /* Detail panel */
  .detail-panel { display: none; position: fixed; right: 0; top: 0; bottom: 0; width: 440px; background: #1a1f2e; border-left: 1px solid #2f3847; overflow-y: auto; padding: 20px; z-index: 100; }
  .detail-panel.active { display: block; }
  .detail-panel h2 { font-size: 15px; margin-bottom: 14px; color: #f7dc6f; border-bottom: 1px solid #2f3847; padding-bottom: 8px; }
  .detail-panel .section { margin-bottom: 18px; }
  .detail-panel .section-title { font-size: 10px; text-transform: uppercase; color: #7f8c8d; margin-bottom: 6px; letter-spacing: 1px; }
  .detail-panel .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: #2f3847; color: #f7dc6f; margin-right: 4px; margin-bottom: 4px; }
  .detail-panel .flow-item { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid #1e2535; font-size: 11px; }
  .detail-panel .flow-time { font-size: 9px; color: #4a5568; width: 48px; flex-shrink: 0; padding-top: 2px; }
  .detail-panel .flow-arrow { color: #4a5568; flex-shrink: 0; }
  .detail-panel .flow-content { flex: 1; }
  .detail-panel .flow-agent { font-size: 9px; color: #f7dc6f; margin-top: 1px; }
  .detail-panel .flow-remark { font-size: 10px; color: #7f8c8d; margin-top: 1px; }
  .close-btn { position: absolute; right: 14px; top: 14px; background: none; border: none; color: #7f8c8d; font-size: 18px; cursor: pointer; }
  .close-btn:hover { color: #f7dc6f; }
  .loading { text-align: center; padding: 40px; color: #7f8c8d; }
  .empty { text-align: center; padding: 30px; color: #3a4555; font-size: 12px; }

  /* Flow badge in cards */
  .flow-badge { display: flex; align-items: center; gap: 4px; font-size: 9px; color: #4a5568; margin-top: 4px; }
  .flow-badge .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

  /* State border indicators */
  .state-承旨 { border-left: 3px solid #9b59b6; }
  .state-机衡 { border-left: 3px solid #3498db; }
  .state-审议 { border-left: 3px solid #e67e22; }
  .state-执行 { border-left: 3px solid #e74c3c; }
  .state-待回奏 { border-left: 3px solid #1abc9c; }
  .state-完成 { border-left: 3px solid #27ae60; }
  .state-阻塞 { border-left: 3px solid #c0392b; }
  .state-待处理 { border-left: 3px solid #7f8c8d; }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <h1>⚔️ 玄机阁</h1>
    <div class="subtitle">自我进化 AI Agent 协作系统</div>
  </div>
  <div style="display:flex;gap:16px;margin-left:auto;align-items:center">
    <div class="stat" style="border:none;padding:0 16px 0 0;border-right:1px solid #2f3847">
      <div style="font-size:10px;color:#7f8c8d">机衡状态</div>
      <div style="font-size:12px;color:#27ae60;margin-top:2px" id="jiyan-status">● 运行中</div>
    </div>
    <div style="font-size:11px;color:#4a5568">
      实时看板 · <span id="last-update">--</span>
    </div>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="num" id="stat-total">0</div><div class="label">全部</div></div>
  <div class="stat"><div class="num" id="stat-pending">0</div><div class="label">待处理</div></div>
  <div class="stat"><div class="num" id="stat-exec">0</div><div class="label">执行中</div></div>
  <div class="stat"><div class="num" id="stat-review">0</div><div class="label">审议/回奏</div></div>
  <div class="stat"><div class="num" id="stat-done">0</div><div class="label">已完成</div></div>
  <div class="stat"><div class="num" id="stat-blocked">0</div><div class="label">阻塞</div></div>
  <div class="stat" style="border-left:3px solid #f7dc6f;border-right:none">
    <div class="num" id="stat-evo">—</div><div class="label">进化度</div>
  </div>
</div>

<div class="kanban-wrap">
  <div class="kanban" id="kanban">
    <div class="loading">加载中...</div>
  </div>
</div>

<div class="detail-panel" id="detail-panel">
  <button class="close-btn" onclick="closeDetail()">×</button>
  <h2 id="detail-title">任务详情</h2>
  <div id="detail-content"></div>
</div>

<script>
// ============================================================
// 玄机阁新架构：承旨 → 机衡 → 审议 → 六部执行 → 回奏
// ============================================================
const COLUMNS = [
  { key: '承旨',    label: '🤴 承旨',     color: '#9b59b6', desc: '消息分拣·旨意整理' },
  { key: '机衡',    label: '⚙️ 机衡',      color: '#3498db', desc: '检索Skill/Role·派发' },
  { key: '审议',    label: '🔍 审议',      color: '#e67e22', desc: '四维审议·准奏/封驳' },
  { key: '执行',    label: '🔨 六部执行',  color: '#e74c3c', desc: '技造/刑策/文册/数算/兵戎' },
  { key: '待回奏',  label: '📤 待回奏',   color: '#1abc9c', desc: '等待汇总·回奏用户' },
  { key: '完成',    label: '🏁 完成',      color: '#27ae60', desc: '任务完成' },
  { key: '阻塞',    label: '🚫 阻塞',      color: '#c0392b', desc: '异常·需干预' },
];

let tasks = [];
let detailTask = null;

async function loadTasks() {
  try {
    const res = await fetch('/api/tasks');
    tasks = await res.json();
    render();
    document.getElementById('last-update').textContent = new Date().toLocaleTimeString('zh-CN');
  } catch (e) {
    console.error('加载失败', e);
  }
}

function render() {
  // Stats
  const total = tasks.length;
  const pending = tasks.filter(t => ['承旨','待处理'].includes(t.state)).length;
  const exec = tasks.filter(t => ['机衡','审议','执行'].includes(t.state)).length;
  const review = tasks.filter(t => ['待回奏'].includes(t.state)).length;
  const done = tasks.filter(t => t.state === '完成').length;
  const blocked = tasks.filter(t => t.state === '阻塞').length;
  const evoPct = total > 0 ? Math.round(done / total * 100) : 0;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-exec').textContent = exec;
  document.getElementById('stat-review').textContent = review;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-blocked').textContent = blocked;
  document.getElementById('stat-evo').textContent = evoPct + '%';

  const kanban = document.getElementById('kanban');
  let html = '';

  for (const col of COLUMNS) {
    const colTasks = tasks.filter(t => {
      if (col.key === '待处理') return t.state === '待处理' || (!t.state && col.key === '待处理');
      return t.state === col.key;
    });

    html += `<div class="column">
      <div class="column-header" style="border-top: 3px solid ${col.color}">
        ${col.label}
        <span style="background:#2f3847;padding:1px 7px;border-radius:10px;font-size:10px;color:#7f8c8d">${colTasks.length}</span>
      </div>
      <div class="column-body">`;

    if (colTasks.length === 0) {
      html += '<div class="empty">—</div>';
    } else {
      for (const t of colTasks) {
        const todos = t.todos || [];
        const completed = todos.filter(td => td.status === 'completed').length;
        const total_todos = todos.length;
        const pct = total_todos > 0 ? Math.round(completed / total_todos * 100) : 0;
        const agent = t.official || t.agent || '';
        const org = t.org || '';

        html += `<div class="task-card state-${t.state || '待处理'}" onclick="showDetail('${t.id}')">
          <div class="task-id">${t.id}</div>
          <div class="task-title">${escapeHtml(t.title || '')}</div>
          <div class="task-meta">
            ${agent ? `<span class="badge" style="color:#f7dc6f">${escapeHtml(agent)}</span>` : ''}
            ${org ? `<span class="badge">${escapeHtml(org)}</span>` : ''}
          </div>
          ${total_todos > 0 ? `<div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>` : ''}
          ${t.flow_log && t.flow_log.length > 0 ? `<div class="flow-badge"><span class="dot" style="background:${col.color}"></span>${t.flow_log[t.flow_log.length-1].to || col.desc}</div>` : ''}
        </div>`;
      }
    }
    html += '</div></div>';
  }

  kanban.innerHTML = html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showDetail(taskId) {
  detailTask = tasks.find(t => t.id === taskId);
  if (!detailTask) return;

  const panel = document.getElementById('detail-panel');
  const content = document.getElementById('detail-content');
  document.getElementById('detail-title').textContent = taskId;

  const stateColor = (COLUMNS.find(c => c.key === detailTask.state) || { color: '#7f8c8d' }).color;

  let html = `
    <div class="section">
      <div class="section-title">标题</div>
      <div style="font-size:13px;line-height:1.5">${escapeHtml(detailTask.title || '—')}</div>
    </div>
    <div class="section">
      <div class="section-title">状态</div>
      <div>
        <span class="tag" style="border-left:3px solid ${stateColor};background:#252d3d">${detailTask.state || '待处理'}</span>
        ${detailTask.official ? `<span class="tag">${escapeHtml(detailTask.official)}</span>` : ''}
        ${detailTask.org ? `<span class="tag">${escapeHtml(detailTask.org)}</span>` : ''}
      </div>
    </div>
    <div class="section">
      <div class="section-title">当前动态</div>
      <div style="font-size:12px;color:#e7e9ea;padding:6px 8px;background:#252d3d;border-radius:4px">${escapeHtml(detailTask.now || '—')}</div>
    </div>
    <div class="section">
      <div class="section-title">流转记录 · ${(detailTask.flow_log || []).length}条</div>`;

  const flowLog = detailTask.flow_log || [];
  if (flowLog.length === 0) {
    html += '<div style="color:#3a4555;font-size:11px">暂无流转记录</div>';
  } else {
    // Show most recent first
    const reversed = [...flowLog].reverse();
    for (const fl of reversed.slice(0, 8)) {
      const col = COLUMNS.find(c => c.key === fl.to);
      const dotColor = col ? col.color : '#4a5568';
      html += `<div class="flow-item">
        <div class="flow-time">${(fl.at || '').slice(11, 16)}</div>
        <div class="flow-arrow" style="color:${dotColor}">●</div>
        <div class="flow-content">
          <div>${escapeHtml(fl.from || '')} → <strong style="color:#e7e9ea">${escapeHtml(fl.to || '')}</strong></div>
          ${fl.remark ? `<div class="flow-remark">${escapeHtml(fl.remark)}</div>` : ''}
          ${fl.agent ? `<div class="flow-agent">@${escapeHtml(fl.agent)}</div>` : ''}
        </div>
      </div>`;
    }
  }
  html += '</div>';

  const todos = detailTask.todos || [];
  if (todos.length > 0) {
    const doneCount = todos.filter(td => td.status === 'completed').length;
    html += `<div class="section">
      <div class="section-title">子任务 · ${doneCount}/${todos.length}完成</div>`;
    for (const td of todos) {
      const check = td.status === 'completed' ? '✅' : '⬜';
      html += `<div style="font-size:11px;padding:3px 0;color:${td.status === 'completed' ? '#7f8c8d' : '#e7e9ea'}">${check} ${escapeHtml(td.title || '')}</div>`;
    }
    html += '</div>';
  }

  const progressLog = detailTask.progress_log || [];
  if (progressLog.length > 0) {
    html += `<div class="section">
      <div class="section-title">最近进展</div>`;
    for (const pl of progressLog.slice(-4)) {
      html += `<div style="padding:5px 0;border-bottom:1px solid #1e2535;font-size:11px">
        <div>${escapeHtml(pl.current || '')}</div>
        ${pl.plan ? `<div style="color:#7f8c8d;font-size:10px;margin-top:2px">→ ${escapeHtml(pl.plan)}</div>` : ''}
      </div>`;
    }
    html += '</div>';
  }

  content.innerHTML = html;
  panel.classList.add('active');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('active');
  detailTask = null;
}

// Auto-refresh every 5s
loadTasks();
setInterval(loadTasks, 5000);
</script>
</body>
</html>
